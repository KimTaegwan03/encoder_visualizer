<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ entry.title }}</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 32px; }
    .card { max-width: 980px; margin: 0 auto; padding: 20px; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    .meta { color: #6b7280; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: #f3f4f6; }
    .btn { text-decoration: none; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 10px; }
    video { width: 100%; border-radius: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ entry.title }}</h1>
    <div class="meta">{{ entry.channel }} • {{ entry.publish_date_str }} • {{ entry.length_str }} • Views: {{ entry.views if entry.views is not none else '—' }}</div>
    <div class="meta">ID: <code>{{ entry.id }}</code></div>

    {% if entry.persons %}
      <div class="chips">
        {% for p in entry.persons %}<span class="chip">{{ p }}</span>{% endfor %}
      </div>
    {% endif %}

    <video controls preload="metadata" src="{{ entry.video_rel }}"></video>

    <div style="margin-top: 16px; display:flex; gap: 12px;">
      <a class="btn" href="/">Back</a>
      <a class="btn" href="/process?video_id={{ entry.id }}">Process this video</a>
      <a class="btn" href="{{ entry.asd_rel }}" target="_blank">Open ASD JSON</a>
    </div>
  </div>
</body>
</html>
